<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>GOLDEN NUMBER - FAZEL KHAN DATABASE</title>
    <style>
        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        body {
            background: linear-gradient(-45deg, #0f172a, #1a1a1a, #2c1a04, #0f172a);
            background-size: 400% 400%;
            animation: bgMove 12s ease infinite;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        #authScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at center, #1e1e1e 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .auth-card {
            background: #111827;
            padding: 35px 20px;
            border-radius: 25px;
            border: 2px solid #fbbf24;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.25);
        }
        .gold-text { color: #fbbf24; text-shadow: 0 0 15px rgba(251, 191, 36, 0.6); font-weight: 900; }
        .login-input {
            width: 85%;
            padding: 12px;
            margin: 8px 0;
            background: #1f2937;
            border: 1px solid #d97706;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            text-align: center;
            outline: none;
        }
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; align-items: center; }
        .auth-btn { color: #000000; border: none; padding: 14px; font-size: 16px; border-radius: 25px; cursor: pointer; font-weight: bold; width: 90%; }
        .btn-login { background: linear-gradient(90deg, #d97706, #fbbf24); }
        .btn-signup { background: #1f2937; color: #fbbf24; border: 1px solid #fbbf24; }

        .container {
            background: linear-gradient(135deg, rgba(28, 25, 23, 0.95), rgba(68, 64, 60, 0.95));
            padding: 30px;
            border-radius: 30px;
            width: 85%;
            max-width: 420px;
            margin: 20px auto;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            border: 2px solid #fbbf24;
            direction: rtl;
            position: relative;
        }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 6px 15px; font-size: 12px; border-radius: 20px; cursor: pointer; position: absolute; top: 15px; left: 15px; }
        .score-board { font-size: 18px; color: #000000; margin-bottom: 25px; font-weight: bold; background: linear-gradient(90deg, #d97706, #fbbf24); padding: 10px 25px; border-radius: 50px; display: inline-block; margin-top: 20px; }
        .football-field { display: flex; justify-content: center; gap: 15px; margin: 30px 0; }
        .ball-btn { background-color: #1c1917; color: #fbbf24; border: 3px solid #d97706; width: 80px; height: 80px; font-size: 22px; border-radius: 50%; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5); }
        .next-btn { background: linear-gradient(90deg, #10b981, #059669); color: white; border: none; padding: 14px 25px; font-size: 16px; border-radius: 12px; cursor: pointer; margin-top: 20px; display: none; width: 100%; }
    </style>
</head>
<body>

    <div id="authScreen">
        <div class="auth-card">
            <h1 class="gold-text" style="font-size: 32px; margin: 0;">GOLDEN NUMBER</h1>
            <h2 style="color: #cbd5e1; font-size: 12px; margin-top: 5px; font-weight: bold;">FAZEL KHAN NETWORK</h2>
            <div style="width: 40px; height: 2px; background: #fbbf24; margin: 15px auto;"></div>
            
            <input type="text" id="usernameInput" class="login-input" placeholder="Enter Username">
            <input type="text" id="emailInput" class="login-input" placeholder="Enter Email (Only for Sign Up)">
            <input type="password" id="passwordInput" class="login-input" placeholder="Enter Password">
            
            <div class="btn-group">
                <button onclick="handleLogin()" class="auth-btn btn-login">LOG IN / ورود</button>
                <button onclick="handleSignUp()" class="auth-btn btn-signup">CREATE ACCOUNT / ثبت‌نام</button>
            </div>
        </div>
    </div>

    <div class="container">
        <button onclick="handleLogout()" class="logout-btn">Log Out</button>
        <h1 class="gold-text" style="font-size: 28px; margin-top: 15px;">⚽ لیگ طلایی فضل خان</h1>
        <p style="color: #d6d3d1; font-size: 14px;">عدد شانس بزرگ درون یکی از توپ‌های سیاه پنهان است. شوت بزن!</p>
        <div class="score-board">🏆 امتیاز فضل خان: <span id="score">۰</span></div>
        <div class="football-field">
            <button onclick="checkAnswer(this)" class="ball-btn" id="opt1">--</button>
            <button onclick="checkAnswer(this)" class="ball-btn" id="opt2">--</button>
            <button onclick="checkAnswer(this)" class="ball-btn" id="opt3">--</button>
        </div>
        <div id="statusMessage" style="color: #fbbf24;">کدام توپ گل طلا می‌شود؟</div>
        <button onclick="startNewRound()" class="next-btn" id="nextRoundBtn">⚽ شوت به دست جدید</button>
    </div>

    <script>
        // 🔗 اتصال مستقیم از طریق سیستم کمکی هوشمند SheetDB
        var sheetDbUrl = 'لینک_جدید_SheetDB_شما';

        window.onload = function() {
            var savedSession = localStorage.getItem("currentActiveUser");
            if (savedSession) { document.getElementById("authScreen").style.display = "none"; }
            startNewRound();
        };

        function sendToGoogleSheet(playerData) {
            if (sheetDbUrl === 'https://docs.google.com/spreadsheets/d/1e8hJ5ShMoWEDYN2vnQS_IKP3mSlvjHn9B4YKs1YwjQY/edit?usp=drivesdk') return;
            
            var payload = {
                data: [{
                    "Player ID": playerData.player_id,
                    "Username": playerData.username,
                    "Email": playerData.email,
                    "Total Score": playerData.total_score,
                    "Level": playerData.level,
                    "Join Date": playerData.join_date,
                    "Last Played": playerData.last_played
                }]
            };

            fetch(sheetDbUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        }

        function handleSignUp() {
            var user = document.getElementById("usernameInput").value.trim();
            var email = document.getElementById("emailInput").value.trim();
            var pass = document.getElementById("passwordInput").value.trim();
            
            if (user === "" || pass === "" || email === "") { alert("Please fill Username, Email and Password!"); return; }

            var existingUser = localStorage.getItem("user_" + user);
            if (existingUser) { alert("This username already exists!"); return; }

            var pId = "PL-" + Math.floor(100000 + Math.random() * 900000);
            var today = new Date().toLocaleDateString('fa-IR');

            var accountData = {
                player_id: pId,
                username: user,
                email: email,
                password: pass,
                total_score: 0,
                level: 1,
                join_date: today,
                last_played: today
            };

            localStorage.setItem("user_" + user, JSON.stringify(accountData));
            sendToGoogleSheet(accountData);
            alert("🎉 Account successfully created! ID: " + pId + "\nNow click LOG IN to start!");
        }

        function handleLogin() {
            var user = document.getElementById("usernameInput").value.trim();
            var pass = document.getElementById("passwordInput").value.trim();
            if (user === "" || pass === "") { alert("Please enter Username and Password!"); return; }

            var savedDataStr = localStorage.getItem("user_" + user);
            if (!savedDataStr) { alert("❌ Username not found!"); return; }

            var savedData = JSON.parse(savedDataStr);
            if (savedData.password !== pass) {
                alert("❌ Wrong Password!");
            } else {
                localStorage.setItem("currentActiveUser", user);
                document.getElementById("authScreen").style.display = "none";
                alert("✅ Welcome, " + user + "!");
            }
        }

        function handleLogout() {
            localStorage.removeItem("currentActiveUser");
            document.getElementById("authScreen").style.display = "flex";
            document.getElementById("usernameInput").value = "";
            document.getElementById("emailInput").value = "";
            document.getElementById("passwordInput").value = "";
        }

        var correctAnswer = 0;
        var score = 0;
        var canPlay = true;

        function startNewRound() {
            canPlay = true;
            document.getElementById("statusMessage").innerHTML = "کدام توپ گل طلا می‌شود؟";
            document.getElementById("statusMessage").style.color = "#fbbf24";
            document.getElementById("nextRoundBtn").style.display = "none";
            
            correctAnswer = Math.floor(Math.random() * 100) + 1;
            var wrong1 = correctAnswer + Math.floor(Math.random() * 10) + 2;
            var wrong2 = correctAnswer - Math.floor(Math.random() * 10) - 2;
            if(wrong2 < 1) wrong2 = correctAnswer + 12;
