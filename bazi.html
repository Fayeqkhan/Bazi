<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1020"><title>GOLDEN NUMBER — Fazl Khan</title><style>:root{--gold:#ffd166;--gold2:#f59e0b;--bg:#080d1b;--panel:#111a2d;--line:#35415a;--green:#22c55e;--red:#ef4444}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f8fafc;font-family:Tahoma,sans-serif;background:radial-gradient(ellipse at top,#1d2b45 0,#0b1020 48%,#060912 100%);background-attachment:fixed}button,input{font:inherit}button{cursor:pointer}.wrap{width:min(960px,94%);margin:auto;padding:22px 0 42px}header{text-align:center;padding:20px 8px}.logo{font-size:clamp(28px,6vw,48px);font-weight:900;color:var(--gold);text-shadow:0 0 22px #f59e0b55}.sub{color:#b9c4d9;margin-top:8px}.panel{background:linear-gradient(145deg,#151f34ee,#0e1628ee);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,4vw,28px);box-shadow:0 18px 55px #0006;margin:16px auto}.hidden{display:none!important}.auth{max-width:460px;margin:12px auto}h2{margin:0 0 14px;color:var(--gold)}.field{display:block;width:100%;padding:13px 14px;margin:10px 0;border-radius:12px;border:1px solid #45516b;background:#080f1f;color:white}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;transition:transform .15s}.btn:active{transform:scale(.98)}.primary{background:linear-gradient(100deg,#f59e0b,#ffe08a);color:#241400}.secondary{background:#263550;color:#fff;border:1px solid #4b5a75}.danger{background:#7f1d1d;color:white}.small{font-size:12px;color:#a9b6cd;line-height:1.8}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{background:#17233a;color:#dbeafe;border:1px solid #3c4b67;border-radius:10px;padding:9px 13px}.tab.active{background:#fbbf24;color:#1c1917;border-color:#fbbf24;font-weight:bold}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{background:#0a1223;border:1px solid #2d3b55;border-radius:14px;padding:13px 8px;text-align:center}.stat strong{display:block;color:var(--gold);font-size:23px;margin-top:6px}.field-area{background:linear-gradient(#123a2d,#0b251f);border:2px solid #27634c;border-radius:18px;padding:22px 12px;margin:18px 0;position:relative;overflow:hidden}.field-area:before{content:"";position:absolute;inset:12px;border:1px solid #ffffff24;border-radius:12px;pointer-events:none}.balls{display:flex;justify-content:center;gap:clamp(8px,3vw,22px);flex-wrap:wrap}.ball{width:clamp(76px,20vw,112px);height:clamp(76px,20vw,112px);border-radius:50%;border:3px solid #fbbf24;background:radial-gradient(circle at 30% 25%,#46516a,#111827 60%);color:var(--gold);font-size:25px;font-weight:900;box-shadow:0 8px 18px #0008,inset 0 0 18px #0008;transition:transform .2s}.ball:hover{transform:translateY(-5px)}.ball.correct{background:linear-gradient(135deg,#16a34a,#064e3b);border-color:#86efac;color:white}.ball.wrong{background:linear-gradient(135deg,#dc2626,#7f1d1d);border-color:#fca5a5;color:white}#message{min-height:32px;font-weight:bold;color:var(--gold);line-height:1.8}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:14px}footer{text-align:center;color:#8290aa;font-size:12px;margin-top:22px}</style></head><body><div class="wrap"><header><div class="logo">GOLDEN NUMBER</div><div class="sub">PREMIUM CLUB · BY FAZL KHAN</div></header><section id="authPanel" class="panel auth"><h2>ورود بازیکن</h2><p class="small">اطلاعات شما به صورت واقعی در دیتابیس فضل خان ذخیره می‌شود.</p><input id="username" class="field" placeholder="نام بازیکن"><input id="email" class="field" type="email" placeholder="ایمیل بازیکن (فقط برای ثبت‌نام)"><input id="password" class="field" type="password" placeholder="رمز عبور"><div class="actions"><button class="btn primary" onclick="handleLogin()">ورود به میدان</button><button class="btn secondary" onclick="handleSignUp()">ثبت‌نام بازیکن جدید</button></div></section><section id="gamePanel" class="panel hidden"><div class="topline"><div id="welcomeMsg">سلام 👋</div><button class="btn danger" onclick="handleLogout()">خروج</button></div><div class="tabs" style="margin-top:15px;"><button class="tab active">🎮 بازی</button><button class="tab" onclick="alert('به زودی!')">🏆 رکوردها</button><button class="tab" onclick="alert('عدد درست را پیدا کن!')">ℹ️ راهنما</button></div><div class="topline" style="margin:15px 0;"><div style="color:var(--gold);font-weight:bold;font-size:18px;">⚽ لیگ طلایی</div><div><span>سطح: </span><select style="background:#17233a;color:white;padding:5px;border-radius:8px;"><option>معمولی</option><option>متوسط</option><option>حرفه‌ای</option></select></div></div><div class="stats"><div class="stat">امتیاز<strong id="scoreVal">0</strong></div><div class="stat">مرحله<strong id="roundVal">1</strong></div><div class="stat">بهترین رکورد<strong id="highScoreVal">0</strong></div></div><div class="field-area"><div class="balls"><button class="ball" id="opt1" onclick="checkAnswer(this)">--</button><button class="ball" id="opt2" onclick="checkAnswer(this)">--</button><button class="ball" id="opt3" onclick="checkAnswer(this)">--</button></div></div><div id="message">کدام توپ عدد طلایی را پنهان کرده است؟</div><div class="actions"><button class="btn primary" onclick="startNewRound()">شروع دوباره</button></div></section><footer>GOLDEN NUMBER · نسخه پایگاه داده آنلاین فضل خان</footer></div><script>var sheetDbUrl='https://sheetdb.io correctAnswer=0,score=0,round=1,highScore=0,canPlay=true;window.onload=function(){var s=localStorage.getItem("currentActiveUser");if(s){document.getElementById("authPanel").classList.add("hidden");document.getElementById("gamePanel").classList.remove("hidden");document.getElementById("welcomeMsg").innerHTML="سلام، "+s+" 👋"}startNewRound()};function sendToGoogleSheet(d){if(!sheetDbUrl.includes('http'))return;fetch(sheetDbUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:[{"Player ID":d.player_id,"Username":d.username,"Email":d.email,"Total Score":d.total_score,"Level":d.level,"Join Date":d.join_date,"Last Played":d.last_played}]})})}function handleSignUp(){var u=document.getElementById("username").value.trim(),e=document.getElementById("email").value.trim(),p=document.getElementById("password").value.trim();if(!u||!e||!p){alert("لطفاً تمام کادرها را پر کنید!");return}if(localStorage.getItem("user_"+u)){alert("این نام کاربری قبلاً ثبت شده است!");return}var pId="PL-"+Math.floor(100000+Math.random()*900000),today=new Date().toLocaleDateString('fa-IR');var acc={player_id:pId,username:u,email:e,password:p,total_score:0,level:1,join_date:today,last_played:today};localStorage.setItem("user_"+u,JSON.stringify(acc));sendToGoogleSheet(acc);alert("🎉 حساب با موفقیت ایجاد شد! حالا دکمه ورود را بزنید.")}function handleLogin(){var u=document.getElementById("username").value.trim(),p=document.getElementById("password").value.trim();var dStr=localStorage.getItem("user_"+u);if(!dStr){alert("❌ نام کاربری یافت نشد!");return}if(JSON.parse(dStr).password!==p){alert("❌ رمز اشتباه است!")}else{localStorage.setItem("currentActiveUser",u);document.getElementById("authPanel").classList.add("hidden");document.getElementById("gamePanel").classList.remove("hidden");document.getElementById("welcomeMsg").innerHTML="سلام، "+u+" 👋"}}function handleLogout(){localStorage.removeItem("currentActiveUser");document.getElementById("authPanel").classList.remove("hidden");document.getElementById("gamePanel").classList.add("hidden")}function startNewRound(){canPlay=true;document.getElementById("message").innerHTML="کدام توپ عدد طلایی را پنهان کرده است؟";document.getElementById("roundVal").innerHTML=round;correctAnswer=Math.floor(Math.random()*100)+1;var w1=correctAnswer+5,w2=correctAnswer-5;if(w2<1)w2=correctAnswer+12;var opts=[correctAnswer,w1,w2].sort(()=>Math.random()-0.5);for(let i=1;i<=3;i++){var btn=document.getElementById("opt"+i);if(btn){btn.innerHTML=opts[i-1];btn.value=opts[i-1];btn.className="ball"}}}function checkAnswer(b){if(!canPlay)return;canPlay=false;if(b.value==correctAnswer){b.classList.add("correct");score+=10;round+=1;if(score>highScore){highScore=score;document.getElementById("highScoreVal").innerHTML=highScore}document.getElementById("scoreVal").innerHTML=score;document.getElementById("message").innerHTML="🎯 گلللللل! عدد طلایی را پیدا کردی. دست بعدی!"}else{b.classList.add("wrong");score=0;round=1;document.getElementById("scoreVal").innerHTML=score;document.getElementById("message").innerHTML="❌ اوت شد! عدد طلایی "+correctAnswer+" بود.";for(let i=1;i<=3;i++){var btn=document.getElementById("opt"+i);if(btn&&btn.value==correctAnswer){btn.classList.add("correct")}}}}</script></body></html>
