<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLDEN NUMBER - FAZL KHAN</title>
    <!-- اتصال به سرور مرکزی استایل‌ها و دیزاین طلایی و نئونی فضل خان -->
    <link rel="stylesheet" href="https://github.io">
</head>
<body>

    <!-- 🚪 صفحه ورود و ثبت‌نام متصل به دیتابیس SheetDB شما -->
    <div id="authScreen">
        <div class="auth-card">
            <h1 style="color:#fbbf24; margin:0; font-size:30px; text-align:center;">GOLDEN NUMBER</h1>
            <h2 style="color:#cbd5e1; font-size:12px; margin-top:5px; text-align:center;">FAZEL KHAN NETWORK</h2>
            <div style="width:40px; height:2px; background:#fbbf24; margin:15px auto;"></div>
            <input type="text" id="usernameInput" class="login-input" placeholder="Enter Username">
            <input type="text" id="emailInput" class="login-input" placeholder="Enter Email (Only Sign Up)">
            <input type="password" id="passwordInput" class="login-input" placeholder="Enter Password">
            <div class="btn-group">
                <button onclick="handleLogin()" class="auth-btn btn-login">LOG IN / ورود</button>
                <button onclick="handleSignUp()" class="auth-btn btn-signup">CREATE ACCOUNT / ثبت‌نام</button>
            </div>
        </div>
    </div>

    <!-- 🎮 کادر اصلی مسابقه دقیقاً منطبق با تصویر دلخواه شما -->
    <div style="color: #fbbf24; font-size: 24px; font-weight: 900; margin-bottom: 2px; text-align:center;">GOLDEN NUMBER</div>
    <div class="header-sub" style="text-align:center; color:#94a3b8; font-size:13px; margin-bottom:20px;">PREMIUM CLUB · BY FAZL KHAN</div>

    <div class="game-card">
        <div class="top-bar">
            <div class="welcome-user">سلام، <span id="displayUser" style="color:#fbbf24; font-weight:bold;">Player</span> 👋</div>
            <button onclick="handleLogout()" class="btn-menu">خروج</button>
        </div>
        <div class="menu-grid">
            <button class="grid-item active-tab">🎮 بازی</button>
            <button onclick="alert('جدول رکوردهای فضل خان به زودی فعال می‌شود!')" class="grid-item">🏆 رکوردها</button>
            <button onclick="alert('یکی از سه توپ را انتخاب کن. عدد طلایی را پیدا کن و امتیاز بگیر!')" class="grid-item">ℹ️ راهنما</button>
        </div>
        <div class="level-section">
            <div class="league-title">⚽ لیگ طلایی</div>
            <div>
                <span style="color:#64748b; font-size:14px;">سطح: </span>
                <select class="level-select"><option>معمولی</option><option>متوسط</option><option>حرفه‌ای</option></select>
            </div>
        </div>
        <div class="stats-grid">
            <div class="stat-box"><div class="stat-label">امتیاز</div><div class="stat-value" id="scoreVal">0</div></div>
            <div class="stat-box"><div class="stat-label">مرحله</div><div class="stat-value" id="roundVal">1</div></div>
            <div class="stat-box"><div class="stat-label">بهترین رکورد</div><div class="stat-value" id="highScoreVal">0</div></div>
        </div>
        <div class="ball-zone">
            <button onclick="checkAnswer(this)" class="ball-btn" id="opt1">--</button>
            <button onclick="checkAnswer(this)" class="ball-btn" id="opt2">--</button>
            <button onclick="checkAnswer(this)" class="ball-btn" id="opt3">--</button>
        </div>
        <div class="footer-msg" id="statusMessage">کدام توپ عدد طلایی را پنهان کرده است؟</div>
        <button onclick="startNewRound()" class="btn-restart">شروع دوباره</button>
    </div>
    <div style="color:#475569; font-size:11px; margin-top:20px; text-align:center;">GOLDEN NUMBER · نسخه آزمایشی محلی</div>

    <!-- اتصال به موتور هوشمند بازی و سیستم فرستنده اطلاعات دیتابیس SheetDB شما -->
    <script src="https://github.io"></script>
</body>
</html>
