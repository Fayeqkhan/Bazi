 <!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بازی هوشمند فضل</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding-top: 30px;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 15px;
            width: 85%;
            max-width: 400px;
            margin: 20px auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .btn {
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            display: inline-block;
            transition: 0.2s;
        }
        .btn-blue { background-color: #38bdf8; }
        .btn-red { background-color: #ef4444; color: white; }
        .btn-green { background-color: #10b981; }
        
        #computerGuessBox {
            font-size: 40px;
            font-weight: bold;
            color: #38bdf8;
            margin: 20px 0;
        }
        #logMessage {
            margin-top: 20px;
            font-size: 16px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 style="color: #38bdf8; font-size: 22px;">🤖 کامپیوتر حدس می‌زند!</h1>
        <p style="color: #94a3b8; font-size: 14px;">یک عدد بین ۱ تا ۱۰۰ در ذهنت انتخاب کن. کامپیوتر شروع به حدس زدن می‌کند.</p>
        
        <p style="margin-top: 20px; font-weight: bold;">حدس کامپیوتر:</p>
        <!-- جایی که حدس کامپیوتر بزرگ نشان داده می‌شود -->
        <div id="computerGuessBox">۵۰</div>
        
        <p style="color: #fbbf24;">عدد ذهنی تو نسبت به این عدد چطور است؟ راهنمایی‌اش کن:</p>
        
        <!-- دکمه‌های فرمان تو به کامپیوتر -->
        <div>
            <button onclick="respond('lower')" class="btn btn-blue">📉 عدد من کوچکتر است</button>
            <button onclick="respond('higher')" class="btn btn-blue">📈 عدد من بزرگتر است</button>
            <button onclick="respond('correct')" class="btn btn-green">🎉 درسته! برنده شدی</button>
        </div>

        <button onclick="resetGame()" class="btn btn-red" style="margin-top: 20px; width: 80%;">🔄 شروع مجدد بازی</button>
        
        <div id="logMessage">تعداد تلاش‌های کامپیوتر: ۱</div>
    </div>

    <script>
        // تعریف محدوده‌های ریاضی بازی
        var minLimit = 1;
        var maxLimit = 100;
        var computerGuess = 50;
        var attempts = 1;

        function respond(answer) {
            var guessBox = document.getElementById("computerGuessBox");
            var logBox = document.getElementById("logMessage");

            if (answer === 'correct') {
                guessBox.style.color = "#10b981";
                logBox.innerHTML = "🏁 کامپیوتر عدد تو را در " + attempts + " حرکت پیدا کرد و برنده شد!";
                return;
            }

            if (answer === 'lower') {
                // اگر عدد تو کوچکتر است، سقف حدس کامپیوتر پایین می‌آید
                maxLimit = computerGuess - 1;
            } else if (answer === 'higher') {
                // اگر عدد تو بزرگتر است، کف حدس کامپیوتر بالا می‌رود
                minLimit = computerGuess + 1;
            }

            // چک کردن برای حالت تقلب یا اشتباه کاربر
            if (minLimit > maxLimit) {
                logBox.innerHTML = "❌ فضل جان! فکر کنم یک جا به کامپیوتر اشتباه راهنمایی دادی! دوباره شروع کن.";
                return;
            }

            // فرمول هوشمند الگوریتم جستجوی باینری (Binary Search)
            computerGuess = Math.floor((minLimit + maxLimit) / 2);
            attempts++;

            // آپدیت کردن صفحه وب
            guessBox.innerHTML = computerGuess;
            logBox.innerHTML = "تعداد تلاش‌های کامپیوتر: " + attempts;
        }

        function resetGame() {
            minLimit = 1;
            maxLimit = 100;
            computerGuess = 50;
            attempts = 1;
            document.getElementById("computerGuessBox").innerHTML = computerGuess;
            document.getElementById("computerGuessBox").style.color = "#38bdf8";
            document.getElementById("logMessage").innerHTML = "تعداد تلاش‌های کامپیوتر: ۱";
        }
    </script>

</body>
</html>
