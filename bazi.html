<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>FAZL KHAN - CHAMPIONS CLUB</title>
    <style>
        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes neonPulse {
            0% { box-shadow: 0 10px 30px rgba(56, 189, 248, 0.3), 0 0 20px rgba(236, 72, 153, 0.2); }
            50% { box-shadow: 0 20px 50px rgba(56, 189, 248, 0.5), 0 0 40px rgba(236, 72, 153, 0.5); }
            100% { box-shadow: 0 10px 30px rgba(56, 189, 248, 0.3), 0 0 20px rgba(236, 72, 153, 0.2); }
        }
        body {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #2e1065, #0284c7);
            background-size: 400% 400%;
            animation: gradientAnimation 10s ease infinite;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            perspective: 1000px;
        }
        #welcomeScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: all 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
        }
        .welcome-card-3d {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            padding: 50px 30px;
            border-radius: 30px;
            border: 2px solid rgba(56, 189, 248, 0.4);
            transform: rotateX(10deg) rotateY(-5deg);
            box-shadow: 20px 30px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(56, 189, 248, 0.2);
            width: 85%;
            max-width: 380px;
            transition: transform 0.5s ease;
        }
        .welcome-card-3d:hover {
            transform: rotateX(0deg) rotateY(0deg) translateZ(10px);
        }
        .enter-btn-3d {
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            color: #020617;
            border: none;
            padding: 18px 45px;
            font-size: 22px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 900;
            margin-top: 35px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 4px solid #00c6ff;
            animation: neonPulse 2.5s infinite;
            transition: all 0.2s ease;
        }
        .enter-btn-3d:active {
            transform: translateY(4px);
            border-bottom-width: 0px;
        }
        .container {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 25px;
            width: 85%;
            max-width: 420px;
            margin: 40px auto;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            border: 2px solid rgba(56, 189, 248, 0.3);
            direction: rtl;
        }
        .score-board {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 25px;
            font-weight: bold;
            background: linear-gradient(90deg, #f43f5e, #ec4899);
            padding: 10px 25px;
            border-radius: 50px;
            display: inline-block;
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
        }
        .football-field {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }
        .ball-btn {
            background-color: #ffffff;
            color: #0f172a;
            border: 3px solid #38bdf8;
            width: 80px;
            height: 80px;
            font-size: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), inset 0 -6px 12px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }
        .ball-btn:active { transform: scale(0.85); }
        #statusMessage {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            min-height: 35px;
        }
        .next-btn {
            background: linear-gradient(90deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 14px 25px;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            display: none;
            width: 100%;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }
    </style>
</head>
<body>

    <div id="welcomeScreen">
        <div class="welcome-card-3d">
            <h1 style="color: #00f2fe; font-size: 34px; margin: 0; font-weight: 900; text-shadow: 0 0 20px rgba(0,242,254,0.6); letter-spacing: 1px;">FAZL KHAN</h1>
            <h2 style="color: #ec4899; font-size: 16px; margin-top: 5px; font-weight: 700; letter-spacing: 3px;">CHAMPIONS CLUB</h2>
            <div style="width: 50px; height: 3px; background: #00f2fe; margin: 25px auto;"></div>
            <p style="color: #94a3b8; font-size: 14px; line-height: 1.6; font-weight: 500;">WELCOME TO THE ULTIMATE 3D NUMBER CHALLENGE ARENA.</p>
            <button onclick="startGame()" class="enter-btn-3d">GET STARTED</button>
        </div>
    </div>

    <div class="container">
        <h1 style="color: #38bdf8; font-size: 26px; margin-top: 0;">⚽ لیگ ستاره‌های فضل</h1>
        <p style="color: #cbd5e1; font-size: 14px;">عدد طلایی درون یکی از توپ‌ها پنهان است. شوت بزن!</p>
        <div class="score-board">🏆 امتیاز فضل خان: <span id="score">۰</span></div>
        <div class="football-field">
            <button onclick="checkAnswer(this)" class="ball-btn" id="opt1">--</button>
            <button onclick="checkAnswer(this)" class="ball-btn" id="opt2">--</button>
            <button onclick="checkAnswer(this)" class="ball-btn" id="opt3">--</button>
        </div>
        <div id="statusMessage" style="color: #f59e0b;">توپ شانس را انتخاب کن!</div>
        <button onclick="startNewRound()" class="next-btn" id="nextRoundBtn">🌟 شوت به دست جدید</button>
    </div>

    <script>
        function startGame() {
            var screen = document.getElementById("welcomeScreen");
            screen.style.opacity = "0";
            screen.style.transform = "scale(1.3) rotateX(20deg)";
            setTimeout(function() {
                screen.style.display = "none";
            }, 800);
        }

        var correctAnswer = 0;
        var score = 0;
        var canPlay = true;

        function startNewRound() {
            canPlay = true;
            document.getElementById("statusMessage").innerHTML = "توپ شانس را انتخاب کن!";
            document.getElementById("statusMessage").style.color = "#f59e0b";
            document.getElementById("nextRoundBtn").style.display = "none";
            correctAnswer = Math.floor(Math.random() * 100) + 1;
            var wrong1 = correctAnswer + Math.floor(Math.random() * 10) + 2;
            var wrong2 = correctAnswer - Math.floor(Math.random() * 10) - 2;
            if(wrong2 < 1) wrong2 = correctAnswer + 12;
            var options = [correctAnswer, wrong1, wrong2];
            options.sort(() => Math.random() - 0.5);
            for (let i = 1; i <= 3; i++) {
                var btn = document.getElementById("opt" + i);
                btn.innerHTML = options[i-1];
                btn.value = options[i-1];
                btn.style.backgroundColor = "#ffffff";
                btn.style.color = "#0f172a";
                btn.style.borderColor = "#38bdf8";
                btn.style.boxShadow = "0 8px 20px rgba(0, 0, 0, 0.4), inset 0 -6px 12px rgba(0,0,0,0.3)";
            }
        }

        function checkAnswer(selectedButton) {
            if (!canPlay) return;
            canPlay = false;
            var userChoice = selectedButton.value;
            var messageBox = document.getElementById("statusMessage");
            var nextBtn = document.getElementById("nextRoundBtn");
            if (userChoice == correctAnswer) {
                selectedButton.style.backgroundColor = "#10b981";
                selectedButton.style.borderColor = "#10b981";
                selectedButton.style.color = "white";
                selectedButton.style.boxShadow = "0 0 25px #10b981, inset 0 -6px 12px rgba(0,0,0,0.2)";
                score += 10;
                document.getElementById("score").innerHTML = score;
                messageBox.style.color = "#10b981";
                messageBox.innerHTML = "🎯 فوق‌العاده بود فضل خان! شوتت گل شد (+۱۰ امتیاز)";
            } else {
                selectedButton.style.backgroundColor = "#ef4444";
                selectedButton.style.borderColor = "#ef4444";
                selectedButton.style.color = "white";
                selectedButton.style.boxShadow = "0 0 25px #ef4444, inset 0 -6px 12px rgba(0,0,0,0.2)";
                messageBox.style.color = "#ef4444";
                messageBox.innerHTML = "❌ خطای شوت! توپ برنده عدد " + correctAnswer + " بود.";
                for (let i = 1; i <= 3; i++) {
                    var btn = document.getElementById("opt" + i);
                    if(btn.value == correctAnswer) {
                        btn.style.backgroundColor = "#10b981";
                        btn.style.borderColor = "#10b981";
                        btn.style.color = "white";
                        btn.style.boxShadow = "0 0 20px #10b981";
                    }
                }
            }
